name: Playback checks

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  booth:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: web/src
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: web/src/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run build
